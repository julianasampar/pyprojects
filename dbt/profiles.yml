dbt_project:
  target: sqlite_dev

  outputs:
    sqlite_dev:
      type: sqlite
      threads: 1
      database: 'database'
      schema: 'main'
      schemas_and_paths:
        main: ./dbt_database.db
      schema_directory: .

    duckdb_dev:
        type: duckdb
        path: ./dbt_database.duckdb
        threads: 4