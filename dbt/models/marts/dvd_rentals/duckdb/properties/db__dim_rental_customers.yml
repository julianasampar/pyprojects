version: 2

models:
  - name: db__dim_rental_customers
    description: |
      Dimension table containing customer attributes and contact information.
      Includes created date derived from first rental activity to handle inconsistent source data.
    columns:
      - name: customer_id
        description: Unique identifier for each customer
        tests:
          - unique:
              severity: warn
          - not_null:
              severity: warn
      - name: first_name
        description: Customer's first name
        tests:
          - not_null:
              severity: warn
      - name: last_name
        description: Customer's last name
        tests:
          - not_null:
              severity: warn
      - name: email
        description: Customer's email address
      - name: created_date
        description: Date when the customer was created (derived from first rental date)
