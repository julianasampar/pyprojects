version: 2

sources:
  - name: main
    description: DVD Rental Store raw data
    tables:
      - name: dvd_rental_store__rental
        description: Rental transactions
        columns:
          - name: rental_id
            description: Unique rental identifier
          - name: rental_date
            description: Date and time when the rental occurred
          - name: inventory_id
            description: Reference to inventory item
          - name: customer_id
            description: Reference to customer
          - name: return_date
            description: Date and time when the rental was returned
          - name: staff_id
            description: Reference to staff member

      - name: dvd_rental_store__payment
        description: Payment records for rentals
        columns:
          - name: payment_id
            description: Unique payment identifier
          - name: customer_id
            description: Reference to customer
          - name: rental_id
            description: Reference to rental
          - name: amount
            description: Payment amount
          - name: payment_date
            description: Date and time of payment

      - name: dvd_rental_store__inventory
        description: Film inventory by store
        columns:
          - name: inventory_id
            description: Unique inventory identifier
          - name: film_id
            description: Reference to film
          - name: store_id
            description: Reference to store
          - name: last_update
            description: Last update timestamp

      - name: dvd_rental_store__film
        description: Film catalog
        columns:
          - name: film_id
            description: Unique film identifier
          - name: title
            description: Film title
          - name: rental_duration
            description: Rental duration in days
          - name: rental_rate
            description: Rental rate amount
          - name: replacement_cost
            description: Replacement cost if damaged

      - name: dvd_rental_store__customer
        description: Customer information
        columns:
          - name: customer_id
            description: Unique customer identifier
          - name: first_name
            description: Customer first name
          - name: last_name
            description: Customer last name
          - name: email
            description: Customer email address
